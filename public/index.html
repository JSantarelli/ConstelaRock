<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mapa Musical 3D — prueba UMAP</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="./img/favicon.ico">
  <link rel="stylesheet" href="./style.css">
</head>
<body id="wrapper">
  <main id="app">
    <div id="map"></div>

    <header class="title">
      <img src="./img/constelaLogo.png" width="160" height="48"></i>
    </header>
    <nav class="topbar" aria-label="Navegación del mapa">

       <div class="topbar_switch" role="group" aria-label="Modo de visualización">
        <button type="button" class="topbar_btn" data-mode="exploratorio" aria-pressed="true">
          <svg class="topbar_icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">
            <path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/>
          </svg>
          <span class="topbar_label">Exploratorio</span>
        </button>
        <button type="button" class="topbar_btn" data-mode="cronologico" aria-pressed="false">
          <svg class="topbar_icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">
            <path d="M3 7h3c4 0 6 10 11 10h4M3 17h3c1.5 0 2.7-.9 3.7-2.2M14.3 9.2C15.3 7.9 16 7 17 7h4"/><path d="M18 4l3 3-3 3M18 14l3 3-3 3"/>
          </svg>
          <span class="topbar_label">Cronológico</span>
        </button>
      </div>

      <!-- Reabre el onboarding -->
      <button id="homeBtn" type="button" class="topbar_btn">
        <svg class="topbar_icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">
          <path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/>
        </svg>
        <span class="topbar_label">Inicio</span>
      </button>

      <!-- Abre / cierra el sidebar de filtros -->
      <button id="sidebarOpen" type="button" class="topbar_btn" aria-controls="sidebar" aria-expanded="false">
        <svg class="topbar_icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2" fill="currentColor"/><circle cx="15" cy="12" r="2" fill="currentColor"/><circle cx="8" cy="18" r="2" fill="currentColor"/>
        </svg>
        <span class="topbar_label">Filtrar</span>
      </button>
    </nav>
    <div id="tooltip" class="tooltip"></div>
    <div class="status" id="status">Cargando datos…</div>
  </main>
  <aside class="sidebar" id="sidebar">
    <header class="sidebar_header">
      <div class="sidebar_header-actions">
        <span class="sidebar_subheader">
          <h2 class="sidebar_title">Filtrar</h2>
          <p class="sidebar_count"><span id="count"></span></p>
        </span>
        <span class="sidebar_subheader">
          <button id="filtersClear" type="button" class="sidebar_btn">
            <span>Resetear</span>
          </button>
          <button id="sidebarClose" type="button" class="sidebar_close" aria-label="Cerrar panel">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="2" y1="2" x2="14" y2="14"/><line x1="14" y1="2" x2="2" y2="14"/></svg>
          </button>
        </span>
      </div>
      <div class="sidebar_search">
        <div class="sidebar_input">
          <svg class="sidebar_search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><line x1="15.5" y1="15.5" x2="21" y2="21"/></svg>
          <input id="search" class="sidebar_input-field" type="search" placeholder="Buscar artista y/o album" autocomplete="off">
        </div>
        <div id="searchResults" class="search-results"></div>
      </div>  
      <template id="albumList"></template>  
      <div id="selectedChips" class="sidebar_chips-container" hidden></div>
    </header>

    <details class="sidebar_section" open>
      <summary class="sidebar_accordion-header">
        <span class="sidebar_caret" aria-hidden="true"></span>
        Filtros avanzados
      </summary>
      <div class="sidebar_accordion-content">
        <div class="sidebar_form">
          <label class="sidebar_field">
            <span class="sidebar_input-label">Desde</span>
            <select id="filterYearFrom" class="sidebar_select"></select>
          </label>
          <label class="sidebar_field">
            <span class="sidebar_input-label">Hasta</span>
            <select id="filterYearTo" class="sidebar_select"></select>
          </label>
        </div>
        <div class="sidebar_field-group">
          <label class="sidebar_input-label" for="filterDescriptor">Descriptores</label>
          <select id="filterDescriptor" class="sidebar_select"></select>
          <div id="descriptorChips" class="sidebar_chips-container" hidden></div>
        </div>
      </div>
    </details>
    <details class="sidebar_section" open>
      <summary class="sidebar_accordion-header">
        <span class="sidebar_caret" aria-hidden="true"></span>
        Géneros
        <button id="genreLegendToggleAll" type="button" class="sidebar_btn">Expandir todo</button>
      </summary>
      <div class="sidebar_accordion-content">
        <div id="genreLegend" class="sidebar_tree"></div>
      </div>
    </details>

    <details class="sidebar_section" open>
      <summary class="sidebar_accordion-header">
        <span class="sidebar_caret" aria-hidden="true"></span>
        Explorar
      </summary>
      <div class="sidebar_accordion-content">
        <div id="networkInsights" class="sidebar_radio-grid"></div>
      </div>
    </details>
  </aside>
  <script src="./bundle.js" type="module"></script>
</body>
</html>
