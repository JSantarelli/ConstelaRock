<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mapa Musical 3D — prueba UMAP</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main id="app">
    <div id="map"></div>

    <header class="title">
      <span>MAPA MUSICAL 3D</span>
      <h1>Espacio latente</h1>
      <p>Prueba exploratoria · UMAP 3D</p>
    </header>

    <aside class="panel">
      <label class="switch">
      <input type="checkbox" id="timeToggle">
        Tiempo
      </label>

      <div class="panel-section">
        <h2>Discos <small id="count"></small></h2>
        <input id="search" type="search" placeholder="Buscar álbum o artista…">
        <template id="albumList"></template>
        <div id="searchResults" class="search-results"></div>
      </div>

      <div class="panel-section" id="filtersSection">
        <h2>Filtros</h2>
        <div class="filters">
          <div class="filter-group">
            <label for="filterArtist">Artista</label>
            <input id="filterArtist" type="text" placeholder="Escribí un artista…" autocomplete="off">
            <div id="filterArtistResults" class="search-results"></div>
          </div>

        <div class="filter-group">
          <label>Año</label>
          <div class="filter-year-range" style="display:flex;gap:6px;">
            <select id="filterYearFrom"></select>
            <select id="filterYearTo"></select>
          </div>
        </div>

        <div class="filter-group">
          <label for="filterGenrePrimary">Género primario</label>
          <select id="filterGenrePrimary"></select>
        </div>

        <div class="filter-group">
          <label for="filterGenreSecondary">Género secundario</label>
          <select id="filterGenreSecondary"></select>
        </div>

        <div class="filter-group">
          <label for="filterDescriptor">Descriptor</label>
          <select id="filterDescriptor"></select>
        </div>

        <button id="filtersClear" type="button" class="filters-clear" style="display:none;">Limpiar filtros</button>
      </div>
    </div>

      <div class="panel-section">
        <h2>Géneros primarios</h2>
        <div id="genreLegend" class="genre-legend"></div>
      </div>
    </aside>

    <div id="tooltip" class="tooltip"></div>
    <div class="status" id="status">Cargando datos…</div>
  </main>

  <script src="./bundle.js"></script>
</body>
</html>
